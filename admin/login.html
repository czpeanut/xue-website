<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台登入｜粹學文理</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-page">
  <form class="login-box" id="login-form">
    <h1>粹學文理</h1>
    <div class="sub">文章管理後台</div>
    <div class="error-msg" id="login-error"></div>
    <div class="field">
      <label for="email">Email 帳號</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" style="width:100%">登入</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script>
  // 已經登入的話直接進後台，不用再看登入頁
  window.db.auth.getSession().then(function (res) {
    if (res.data.session) window.location.href = 'index.html';
  });

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var errorEl = document.getElementById('login-error');
    errorEl.textContent = '';
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    window.db.auth
      .signInWithPassword({ email: email, password: password })
      .then(function (res) {
        if (res.error) {
          errorEl.textContent = res.error.message === 'Invalid login credentials' ? '帳號或密碼錯誤' : res.error.message;
          return;
        }
        window.location.href = 'index.html';
      })
      .catch(function (err) {
        errorEl.textContent = '無法連線到伺服器，請確認網路連線或稍後再試。';
      });
  });
</script>
</body>
</html>
